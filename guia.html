 padding:16px 20px; border-bottom:1px solid #F0F0F0;\">\n            <span style=\"flex:0 0 32px; width:32px; height:32px; border-radius:9px; background:#FFF1F2; color:#D84752; font-family:'Roboto Flex',sans-serif; font-weight:700; font-size:14px; display:flex; align-items:center; justify-content:center;\">07<\/span>\n            <div style=\"min-width:0;\">\n              <div style=\"font-family:'Inter',sans-serif; font-weight:600; font-size:16px; color:#2A2031;\">Feedback<\/div>\n              <div style=\"font-size:12px; color:#AAAAAA; margin-top:2px;\">Inline para bloqueos, toast para confirmaciones<\/div>\n            <\/div>\n          <\/div>\n          <div style=\"padding:20px; display:flex; gap:24px; flex-wrap:wrap; align-items:flex-start;\">\n            <div style=\"flex:1 1 320px; min-width:280px;\">\n              <div style=\"display:flex; flex-direction:column; gap:14px; max-width:340px;\">\n                <div>\n                  <div style=\"font-family:ui-monospace,Menlo,monospace; font-size:9px; color:#AAAAAA; margin-bottom:6px;\">inline / banner \u2014 permanente hasta resoluci\u00f3n<\/div>\n                  <div style=\"background:#FEF2F2; border-left:3px solid #EF4444; border-radius:8px; padding:10px 12px;\">\n                    <div style=\"display:flex; align-items:center; gap:7px; margin-bottom:3px;\"><span style=\"width:12px;height:12px;border-radius:50%;background:#EF4444;\"><\/span><span style=\"font-size:12px; font-weight:600; color:#EF4444;\">Pago rechazado<\/span><\/div>\n                    <div style=\"font-size:11px; color:#3B3B3B;\">Verifica los datos de tu tarjeta.<\/div>\n                  <\/div>\n                  <div style=\"display:flex; gap:5px; margin-top:6px; font-family:ui-monospace,Menlo,monospace; font-size:8px; color:#7E7E7E;\"><span style=\"background:#F0F0F0; border-radius:3px; padding:2px 5px;\">1 fondo<\/span><span style=\"background:#F0F0F0; border-radius:3px; padding:2px 5px;\">2 \u00edcono + t\u00edtulo<\/span><span style=\"background:#F0F0F0; border-radius:3px; padding:2px 5px;\">3 texto<\/span><\/div>\n                <\/div>\n                <div>\n                  <div style=\"font-family:ui-monospace,Menlo,monospace; font-size:9px; color:#AAAAAA; margin-bottom:6px;\">toast \u2014 transitorio 3s, abajo centrado, L4<\/div>\n                  <div style=\"display:inline-flex; align-items:center; gap:8px; background:#1A1A1A; color:#fff; padding:9px 14px; border-radius:9999px; font-size:11px; font-weight:600; box-shadow:0 16px 40px rgba(0,0,0,0.18);\"><span style=\"color:#10B981;\">\u2713<\/span>Producto agregado<\/div>\n                <\/div>\n              <\/div><\/div>\n            <div style=\"flex:1 1 260px; min-width:240px; display:flex; flex-direction:column; gap:9px;\"><div style=\"display:flex; gap:10px; align-items:flex-start; font-size:13px; line-height:19px; color:#7E7E7E;\"><span style=\"width:6px; height:6px; flex:0 0 6px; border-radius:50%; background:#D84752; margin-top:6px;\"><\/span>Todo error lleva tres se\u00f1ales: color, \u00edcono y texto descriptivo.<\/div><div style=\"display:flex; gap:10px; align-items:flex-start; font-size:13px; line-height:19px; color:#7E7E7E;\"><span style=\"width:6px; height:6px; flex:0 0 6px; border-radius:50%; background:#D84752; margin-top:6px;\"><\/span>El banner inline permanece hasta que el usuario resuelve el problema.<\/div><div style=\"display:flex; gap:10px; align-items:flex-start; font-size:13px; line-height:19px; color:#7E7E7E;\"><span style=\"width:6px; height:6px; flex:0 0 6px; border-radius:50%; background:#D84752; margin-top:6px;\"><\/span>El toast dura 3s, aparece abajo centrado y solo hay uno a la vez.<\/div><div style=\"display:flex; gap:10px; align-items:flex-start; font-size:13px; line-height:19px; color:#7E7E7E;\"><span style=\"width:6px; height:6px; flex:0 0 6px; border-radius:50%; background:#D84752; margin-top:6px;\"><\/span>Nunca comunicar un estado \u00fanicamente con color.<\/div><\/div>\n          <\/div>\n        <\/div>\n\n        <div style=\"border:1px solid #E5E7EB; border-radius:14px; overflow:hidden; background:#fff;\">\n          <div style=\"display:flex; align-items:center; gap:14px; padding:16px 20px; border-bottom:1px solid #F0F0F0;\">\n            <span style=\"flex:0 0 32px; width:32px; height:32px; border-radius:9px; background:#FFF1F2; color:#D84752; font-family:'Roboto Flex',sans-serif; font-weight:700; font-size:14px; display:flex; align-items:center; justify-content:center;\">08<\/span>\n            <div style=\"min-width:0;\">\n              <div style=\"font-family:'Inter',sans-serif; font-weight:600; font-size:16px; color:#2A2031;\">Urgencia y conversi\u00f3n<\/div>\n              <div style=\"font-size:12px; color:#AAAAAA; margin-top:2px;\">Urgencia honesta, con color fijo por significado<\/div>\n            <\/div>\n          <\/div>\n          <div style=\"padding:20px; display:flex; gap:24px; flex-wrap:wrap; align-items:flex-start;\">\n            <div style=\"flex:1 1 320px; min-width:280px;\">\n              <div style=\"max-width:340px; display:flex; flex-direction:column; gap:10px;\">\n                <div style=\"display:flex; align-items:center; gap:8px;\"><span style=\"font-family:'Roboto Flex',sans-serif; font-weight:700; font-size:13px; background:#2A2031; color:#fff; padding:4px 9px; border-radius:6px;\">02:34:18<\/span><span style=\"font-size:12px; color:#7E7E7E;\">countdown<\/span><\/div>\n                <div style=\"font-size:13px; font-weight:600; color:#F96304;\">Solo quedan 3 unidades<\/div>\n                <div style=\"font-size:12px; color:#F96304;\">47 personas viendo esto<\/div>\n                <div style=\"display:flex; align-items:center; gap:7px;\"><span style=\"color:#FDAA40; font-size:14px;\">\u2605\u2605\u2605\u2605\u2605<\/span><span style=\"font-size:12px; color:#7E7E7E;\">4.7 (2,341)<\/span><\/div>\n                <div style=\"display:flex; flex-wrap:wrap; gap:6px; margin-top:4px;\">\n                  <span style=\"font-family:ui-monospace,Menlo,monospace; font-size:9px; background:#FFF1F2; color:#D84752; border-radius:4px; padding:3px 7px;\">oferta = D84752<\/span>\n                  <span style=\"font-family:ui-monospace,Menlo,monospace; font-size:9px; background:#FFF4EA; color:#F96304; border-radius:4px; padding:3px 7px;\">escasez = F96304<\/span>\n                  <span style=\"font-family:ui-monospace,Menlo,monospace; font-size:9px; background:#ECFDF5; color:#10B981; border-radius:4px; padding:3px 7px;\">confianza = 10B981<\/span>\n                  <span style=\"font-family:ui-monospace,Menlo,monospace; font-size:9px; background:#FFFBEB; color:#B37700; border-radius:4px; padding:3px 7px;\">rating = FDAA40<\/span>\n                <\/div>\n              <\/div><\/div>\n            <div style=\"flex:1 1 260px; min-width:240px; display:flex; flex-direction:column; gap:9px;\"><div style=\"display:flex; gap:10px; align-items:flex-start; font-size:13px; line-height:19px; color:#7E7E7E;\"><span style=\"width:6px; height:6px; flex:0 0 6px; border-radius:50%; background:#D84752; margin-top:6px;\"><\/span>Cada significado tiene un color fijo y no se intercambia.<\/div><div style=\"display:flex; gap:10px; align-items:flex-start; font-size:13px; line-height:19px; color:#7E7E7E;\"><span style=\"width:6px; height:6px; flex:0 0 6px; border-radius:50%; background:#D84752; margin-top:6px;\"><\/span>Los recursos de urgencia se dosifican para no generar ansiedad.<\/div><div style=\"display:flex; gap:10px; align-items:flex-start; font-size:13px; line-height:19px; color:#7E7E7E;\"><span style=\"width:6px; height:6px; flex:0 0 6px; border-radius:50%; background:#D84752; margin-top:6px;\"><\/span>La cifra siempre es espec\u00edfica y verdadera (\u201cSolo quedan 3\u201d).<\/div><div style=\"display:flex; gap:10px; align-items:flex-start; font-size:13px; line-height:19px; color:#7E7E7E;\"><span style=\"width:6px; height:6px; flex:0 0 6px; border-radius:50%; background:#D84752; margin-top:6px;\"><\/span>El \u00e1mbar de rating no se usa como texto peque\u00f1o: no alcanza AA.<\/div><\/div>\n          <\/div>\n        <\/div>\n\n        <div style=\"border:1px solid #E5E7EB; border-radius:14px; overflow:hidden; background:#fff;\">\n          <div style=\"display:flex; align-items:center; gap:14px; padding:16px 20px; border-bottom:1px solid #F0F0F0;\">\n            <span style=\"flex:0 0 32px; width:32px; height:32px; border-radius:9px; background:#FFF1F2; color:#D84752; font-family:'Roboto Flex',sans-serif; font-weight:700; font-size:14px; display:flex; align-items:center; justify-content:center;\">09<\/span>\n            <div style=\"min-width:0;\">\n              <div style=\"font-family:'Inter',sans-serif; font-weight:600; font-size:16px; color:#2A2031;\">Autenticaci\u00f3n y facturaci\u00f3n<\/div>\n              <div style=\"font-size:12px; color:#AAAAAA; margin-top:2px;\">Cadenas de CTAs secundarios<\/div>\n            <\/div>\n          <\/div>\n          <div style=\"padding:20px; display:flex; gap:24px; flex-wrap:wrap; align-items:flex-start;\">\n            <div style=\"flex:1 1 320px; min-width:280px;\">\n              <div style=\"display:flex; flex-wrap:wrap; gap:24px;\">\n                \n                <div style=\"flex:1 1 280px; min-width:260px;\">\n                  <div style=\"font-family:ui-monospace,Menlo,monospace; font-size:9px; color:#AAAAAA; margin-bottom:8px;\">autenticaci\u00f3n<\/div>\n                  <div style=\"display:flex; flex-wrap:wrap; gap:7px; align-items:center;\">\n                    <span style=\"display:inline-flex; align-items:center; gap:7px;\"><span style=\"border:1.5px solid #D84752; color:#D84752; font-size:12px; font-weight:600; padding:7px 13px; border-radius:9999px; white-space:nowrap;\">Iniciar sesi\u00f3n<\/span><span style=\"color:#C7C7C7;\">\u2192<\/span><\/span><span style=\"display:inline-flex; align-items:center; gap:7px;\"><span style=\"border:1.5px solid #D84752; color:#D84752; font-size:12px; font-weight:600; padding:7px 13px; border-radius:9999px; white-space:nowrap;\">Crear cuenta<\/span><span style=\"color:#C7C7C7;\">\u2192<\/span><\/span><span style=\"display:inline-flex; align-items:center; gap:7px;\"><span style=\"border:1.5px solid #D84752; color:#D84752; font-size:12px; font-weight:600; padding:7px 13px; border-radius:9999px; white-space:nowrap;\">Recuperar contrase\u00f1a<\/span><\/span>\n                  <\/div>\n                <\/div>\n                \n                <div style=\"flex:1 1 280px; min-width:260px;\">\n                  <div style=\"font-family:ui-monospace,Menlo,monospace; font-size:9px; color:#AAAAAA; margin-bottom:8px;\">facturaci\u00f3n CFDI<\/div>\n                  <div style=\"display:flex; flex-wrap:wrap; gap:7px; align-items:center;\">\n                    <span style=\"display:inline-flex; align-items:center; gap:7px;\"><span style=\"border:1.5px solid #D84752; color:#D84752; font-size:12px; font-weight:600; padding:7px 13px; border-radius:9999px; white-space:nowrap;\">Agregar RFC<\/span><span style=\"color:#C7C7C7;\">\u2192<\/span><\/span><span style=\"display:inline-flex; align-items:center; gap:7px;\"><span style=\"border:1.5px solid #D84752; color:#D84752; font-size:12px; font-weight:600; padding:7px 13px; border-radius:9999px; white-space:nowrap;\">Generar factura<\/span><span style=\"color:#C7C7C7;\">\u2192<\/span><\/span><span style=\"display:inline-flex; align-items:center; gap:7px;\"><span style=\"border:1.5px solid #D84752; color:#D84752; font-size:12px; font-weight:600; padding:7px 13px; border-radius:9999px; white-space:nowrap;\">Solicitar factura<\/span><\/span>\n                  <\/div>\n                <\/div>\n              <\/div><\/div>\n            <div style=\"flex:1 1 260px; min-width:240px; display:flex; flex-direction:column; gap:9px;\"><div style=\"display:flex; gap:10px; align-items:flex-start; font-size:13px; line-height:19px; color:#7E7E7E;\"><span style=\"width:6px; height:6px; flex:0 0 6px; border-radius:50%; background:#D84752; margin-top:6px;\"><\/span>Los formularios usan un primario al final y terciarios para lo opcional.<\/div><div style=\"display:flex; gap:10px; align-items:flex-start; font-size:13px; line-height:19px; color:#7E7E7E;\"><span style=\"width:6px; height:6px; flex:0 0 6px; border-radius:50%; background:#D84752; margin-top:6px;\"><\/span>La facturaci\u00f3n CFDI es un patr\u00f3n propio del mercado mexicano.<\/div><div style=\"display:flex; gap:10px; align-items:flex-start; font-size:13px; line-height:19px; color:#7E7E7E;\"><span style=\"width:6px; height:6px; flex:0 0 6px; border-radius:50%; background:#D84752; margin-top:6px;\"><\/span>Cada paso informa qu\u00e9 falta antes de habilitar el bot\u00f3n.<\/div><\/div>\n          <\/div>\n        <\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <section id=\"templates\" style=\"padding:64px 56px; border-bottom:1px solid #F0F0F0;\">\n      <div style=\"max-width:1040px;\">\n        <div style=\"font-size:11px; font-weight:600; letter-spacing:0.16em; text-transform:uppercase; color:#D84752; margin-bottom:12px;\">10 \u2014 Composici\u00f3n<\/div>\n        <h2 style=\"font-family:'Roboto Flex',sans-serif; font-weight:700; font-size:32px; line-height:40px; letter-spacing:-0.01em; margin:0 0 8px; color:#2A2031;\">Templates mobile<\/h2>\n        <p style=\"font-size:16px; color:#7E7E7E; margin:0 0 32px; max-width:640px;\">Piezas de navegaci\u00f3n sueltas. La estructura libera ~15% de \u00e1rea vertical vs. el dise\u00f1o anterior.<\/p>\n\n        <div style=\"display:flex; flex-direction:column; gap:28px; max-width:420px;\">\n          <div>\n            <div style=\"font-size:12px; color:#7E7E7E; margin-bottom:8px;\">Top NavBar \u00b7 56px<\/div>\n            <div style=\"display:flex; align-items:center; gap:14px; height:56px; padding:0 16px; background:#fff; border:1px solid #E5E7EB; border-radius:12px;\">\n              <img src=\"f63fd425-d0
